name: Lint and build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    uses: GEWIS/actions/.github/workflows/lint-and-build-pnpm.yml@v1
    with:
      node-version: '24.x'
      lint: true
      format: true
      test: true
      build: true
