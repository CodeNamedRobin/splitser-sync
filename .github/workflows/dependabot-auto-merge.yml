name: Dependabot auto approve and merge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependabot:
    uses: GEWIS/actions/.github/workflows/dependabot-auto-merge.yml@v1
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      auto-approve: true
      auto-merge: true
      # Majors need a human; CI must still pass before auto-merge completes.
      update-types: 'version-update:semver-minor,version-update:semver-patch'
      merge-method: 'rebase'
