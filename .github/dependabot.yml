version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'JustSamuel'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'
    ignore:
      # Majors track the Node.js major in the Dockerfile and .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Pinned to the Actual server version; bump together with the server.
      - dependency-name: '@actual-app/api'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      actual:
        patterns: ['@actual-app/*']
      typescript:
        patterns: ['typescript', '@types/*']
      dev-tooling:
        patterns: ['prettier', 'husky', 'lint-staged', '@commitlint/*']
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'JustSamuel'
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'JustSamuel'
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns: ['*']
